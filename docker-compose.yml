version: '3.8'

services:
  # Serviço Backend Laravel
  backend:
    build:
      context: .
    container_name: laravel-backend
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
    networks:
      - app-network
    depends_on:
      - db

  # Serviço Banco de Dados MySQL
  db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: 123456
    ports:
      - "3306:3306"
    networks:
      - app-network

  # Serviço Adminer (Gerenciador de Banco)
  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8081:8080"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
